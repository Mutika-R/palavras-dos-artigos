  select:focus-visible, button:focus-visible, .w:focus-visible { outline: 3px solid var(--t2); outline-offset: 2px; }
  :root[data-theme="dark"] select:focus-visible, :root[data-theme="dark"] button:focus-visible, :root[data-theme="dark"] .w:focus-visible { outline-color: var(--head); }
  .stage {
    position: relative; min-width: 0; background: var(--paper);
    border: 2px solid var(--olive-d); border-radius: 8px;
    outline: 1px solid var(--olive); outline-offset: -8px;
  }
  .corner { position: absolute; width: 46px; height: 46px; pointer-events: none; }
  .corner.tl { top: 4px; left: 4px; }
  .corner.tr { top: 4px; right: 4px; transform: scaleX(-1); }

const F_G = '400 {s}px "Glass Antiqua", Georgia, "Times New Roman", serif';
const F_O = '600 {s}px "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
const T1_N = 10, T2_N = 40;   // limites dos grupos de destaque
const CORNER = 50;            // lado reservado para o ornamento de cada canto

const sum = a => a.reduce((x, y) => x + y, 0);

function items(v) {
  const rows = Object.entries(DATA.words).map(([w, c]) => [w, v === "all" ? sum(c) : c[v], c]);
  const top = v === "all" ? 80 : 60;
  return rows.filter(r => r[1] >= (v === "all" ? 1 : 2)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "pt")).slice(0, top);
}
const tier = i => (i < T1_N ? 1 : i < T2_N ? 2 : 3);

function place(list, W, H) {
  const max = list[0][1], min = list[list.length - 1][1];
  const small = W < 520;
  const fMin = small ? 13 : 14, fMax = small ? 44 : Math.min(96, W * 0.1);
  const c = small ? 38 : CORNER;
  const placed = [
    { x0: 0, y0: 0, x1: c, y1: c }, { x0: W - c, y0: 0, x1: W, y1: c },
    { x0: 0, y0: H - c, x1: c, y1: H }, { x0: W - c, y0: H - c, x1: W, y1: H }
  ];
  const out = [];
  list.forEach(([w, n], i) => {
    const tr = tier(i), g = tr < 3;
    const t = max === min ? 1 : Math.sqrt((n - min) / (max - min));
    let size = fMin + (fMax - fMin) * t, ok = false;
    while (size >= fMin * 0.9 && !ok) {
      ctx.font = (g ? F_G : F_O).replace("{s}", size);
      const bw = ctx.measureText(w).width + 8, bh = size * 1.1 + 4;
      for (let th = 0; th < 90; th += 0.1) {
        const r = 1.3 * th * th ** 0.5 * (size / 16 + 0.6);
        const cx = W / 2 + r * Math.cos(th) * 1.7, cy = H / 2 + r * Math.sin(th);
        const x0 = cx - bw / 2, y0 = cy - bh / 2;
        if (x0 < 12 || y0 < 12 || x0 + bw > W - 12 || y0 + bh > H - 12) { if (r > W) break; continue; }
        if (placed.some(p => x0 < p.x1 && x0 + bw > p.x0 && y0 < p.y1 && y0 + bh > p.y0)) continue;
        placed.push({ x0, y0, x1: x0 + bw, y1: y0 + bh });
        out.push({ w, n, size, x: cx, y: cy, tr, g });
        ok = true; break;
      }
      if (!ok) size *= 0.93;
    }
  });
  return out;
}

  let H = Math.round(W * (W < 520 ? 1.1 : 0.58)), res;
  for (let i = 0; i < 5; i++) {
    res = place(list, W, H);
    if (res.length === list.length) break;
    H = Math.round(H * 1.1);
  }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cnt = new Map(list.map(r => [r[0], r[1]]));
  svg.innerHTML = res.map(o =>
    `<text class="w ${o.g ? "g" : "o"} t${o.tr}" data-w="${o.w}" x="${o.x.toFixed(1)}" y="${o.y.toFixed(1)}" font-size="${o.size.toFixed(1)}" text-anchor="middle" dominant-baseline="central" tabindex="0" aria-label="${o.w}: ${cnt.get(o.w)} ocorrências">${o.w}</text>`
  ).join("");
  legend(list);
  renderTable(list);
  $("tablewrap").hidden = !showTable;
}

function legend(list) {
  const n = list.length, a = Math.min(T1_N, n), b = Math.min(T2_N, n);
  const items = [
    `<span class="it"><span class="sw a" aria-hidden="true">Aa</span>${a} mais frequentes</span>`,
    b > a ? `<span class="it"><span class="sw b" aria-hidden="true">Aa</span>${a + 1}ª a ${b}ª</span>` : "",
    n > b ? `<span class="it"><span class="sw c" aria-hidden="true">Aa</span>demais (${b + 1}ª a ${n}ª)</span>` : ""
  ];
  $("legenda").innerHTML = items.join("") + '<span class="tail">Cor, fonte e tamanho acompanham o número de ocorrências.</span>';
}

function renderTable(list) {
  const rows = list.slice(0, 30);
  const head = view === "all"
    ? `<tr><th>#</th><th>Palavra</th><th>Total</th>${SRC.map(s => `<th>${s.curto}</th>`).join("")}</tr>`
    : `<tr><th>#</th><th>Palavra</th><th>Neste texto</th><th>Nos quatro textos</th></tr>`;
  const body = rows.map((r, i) => view === "all"
    ? `<tr><td>${i + 1}</td><td>${r[0]}</td><td>${fmt(r[1])}</td>${r[2].map(n => `<td>${fmt(n)}</td>`).join("")}</tr>`
    : `<tr><td>${i + 1}</td><td>${r[0]}</td><td>${fmt(r[1])}</td><td>${fmt(sum(r[2]))}</td></tr>`).join("");
  $("tabela").innerHTML = `<caption>As 30 palavras mais frequentes</caption><thead>${head}</thead><tbody>${body}</tbody>`;
}

function note() {
  const tot = DATA.totais;
  $("nota").innerHTML = `<b>Como foi feito.</b> Contagem de palavras com ao menos 4 letras, depois de retirar palavras vazias (português e inglês), citações do tipo (Autor, ano), referências bibliográficas e palavras genéricas como "análise" e "autores". Palavras próximas ("negro", "negra") contam separadas. <b>Fontes:</b> ${SRC.map((s, i) => `${s.longo} (${fmt(tot[i])} palavras contadas)`).join("; ")}. Os dois artigos científicos somam cerca de 91% do total, por isso a vista "Todos os textos" reflete sobretudo eles; use o filtro para ver cada texto. <b>Design:</b> baseado no modelo Art Nouveau Style Presentation, da SlidesCarnival, com as fontes Glass Antiqua e Open Sans; os ornamentos são desenhos próprios.`;
}

// tooltip
function showTip(el, ev) {
  const w = el.dataset.w, c = DATA.words[w], tip = $("tip"), stage = $("stage");
  const total = sum(c);
  tip.innerHTML = `<strong>${w}</strong>` + (view === "all"
    ? `<div class="row"><span>Total</span><b>${fmt(total)}</b></div>` + c.map((n, i) => n ? `<div class="row"><span>${SRC[i].curto}</span><b>${fmt(n)}</b></div>` : "").join("")
    : `<div class="row"><span>Neste texto</span><b>${fmt(c[view])}</b></div><div class="row"><span>Nos quatro textos</span><b>${fmt(total)}</b></div>`);
  tip.hidden = false;
  const sr = stage.getBoundingClientRect(), er = el.getBoundingClientRect();
  let x = (ev && ev.clientX != null ? ev.clientX : er.left + er.width / 2) - sr.left + 14;
  let y = (ev && ev.clientY != null ? ev.clientY : er.bottom) - sr.top + 14;
  x = Math.min(x, sr.width - tip.offsetWidth - 8); y = Math.min(y, sr.height - tip.offsetHeight - 8);
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  $("nuvem").classList.add("dim"); el.classList.add("on");
}
function hideTip() {
  $("tip").hidden = true; $("nuvem").classList.remove("dim");
  document.querySelectorAll(".w.on").forEach(e => e.classList.remove("on"));
}
const svg = $("nuvem");
svg.addEventListener("pointermove", e => { const t = e.target.closest(".w"); hideTip(); if (t) showTip(t, e); });
svg.addEventListener("pointerleave", hideTip);
svg.addEventListener("focusin", e => { const t = e.target.closest(".w"); if (t) showTip(t); });
svg.addEventListener("focusout", hideTip);

// controles
$("texto").innerHTML = '<option value="all">Todos os textos</option>' + SRC.map((s, i) => `<option value="${i}">${s.longo}</option>`).join("");
$("texto").addEventListener("change", e => { view = e.target.value === "all" ? "all" : +e.target.value; hideTip(); render(); });
$("btn-tabela").addEventListener("click", e => {
  showTable = !showTable;
  e.currentTarget.setAttribute("aria-pressed", showTable);
  e.currentTarget.textContent = showTable ? "Ocultar tabela" : "Ver como tabela";
  $("tablewrap").hidden = !showTable;
});

note();
render();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('400 20px "Glass Antiqua"'), document.fonts.load('600 20px "Open Sans"')]).then(render).catch(() => {});
}
let raf, lastW = $("stage").clientWidth;
new ResizeObserver(() => {
  const w = $("stage").clientWidth;
  if (Math.abs(w - lastW) < 2) return;
  lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
}).observe($("stage"));
</script>
</body>
</html>
