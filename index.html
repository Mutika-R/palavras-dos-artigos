<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Esfera 3D interativa com as palavras mais frequentes de dois artigos da Tempo Social e duas matérias da Folha.">
<title>Palavras dos Artigos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Glass+Antiqua&family=Open+Sans:wght@300;400;600&display=swap">
<style>

     Sistema visual: modelo "Art Nouveau Style Presentation" (SlidesCarnival): dourado F8D078, vermelho, azul-marinho 303562, verde-azulado, oliva B5AE60; Glass Antiqua + Open Sans. */
  :root {

    --t1: #c71f1b; --t2: #303562; --t3: #1e6f6c;
    --orn-stem: #7d7728; --orn-leaf: #1e8582; --orn-bud: #c71f1b; --orn-dot: #fff6dc;
    --on-head: #fff6dc; --shadow: rgba(60, 45, 10, .22);

    --font-body: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a2c; --paper: #17253d; --ink: #f3ebd3; --muted: #c4bb96; --olive: #8b8643; --olive-d: #b5ae60;
      --head: #f8d078; --t1: #f0877f; --t2: #f8d078; --t3: #7fd1cc;
      --orn-stem: #b5ae60; --orn-leaf: #4ea8a5; --orn-bud: #f0877f; --orn-dot: #17253d; --on-head: #101a2c; --shadow: rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101a2c; --paper: #17253d; --ink: #f3ebd3; --muted: #c4bb96; --olive: #8b8643; --olive-d: #b5ae60;
    --head: #f8d078; --t1: #f0877f; --t2: #f8d078; --t3: #7fd1cc;
    --orn-stem: #b5ae60; --orn-leaf: #4ea8a5; --orn-bud: #f0877f; --orn-dot: #17253d; --on-head: #101a2c; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 400; }
  .wrap {
    position: relative; max-width: 1120px; margin: 0 auto;
    padding-block: 32px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 22px;
  }
  header { position: relative; padding-right: clamp(0px, 16vw, 150px); min-height: 90px; }
  h1 { font: 400 clamp(38px, 7vw, 64px)/1.02 var(--font-head); color: var(--head); margin: 0; text-wrap: balance; }
  .sub { margin: 12px 0 0; font-weight: 300; font-size: 17px; line-height: 1.55; max-width: 60ch; }
  .vine-top { position: absolute; top: -6px; right: 0; width: clamp(52px, 15vw, 140px); aspect-ratio: 1; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
  .controls label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  select, button {
    font: 400 14px var(--font-body); color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--olive-d); border-radius: 6px; padding: 8px 12px; min-height: 40px;
  }
  select { max-width: 100%; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--head); color: var(--on-head); border-color: var(--head); }
  select:focus-visible, button:focus-visible { outline: 3px solid var(--t2); outline-offset: 2px; }
  .stage {
    position: relative; min-width: 0; background: var(--paper);
    border: 2px solid var(--olive-d); border-radius: 8px;
    outline: 1px solid var(--olive); outline-offset: -8px; overflow: hidden;
  }
  #cena { position: relative; }
  #cena canvas { display: block; max-width: 100%; touch-action: pan-y; cursor: grab; }
  #cena canvas:active { cursor: grabbing; }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); margin: 0; font-size: 12px; color: var(--muted); pointer-events: none; width: max-content; max-width: calc(100% - 110px); text-align: center; }
  .fallback { padding: 48px 24px; text-align: center; color: var(--muted); margin: 0; }
  .corner { position: absolute; width: 46px; height: 46px; pointer-events: none; z-index: 2; }
  .corner.tl { top: 4px; left: 4px; }
  .corner.tr { top: 4px; right: 4px; transform: scaleX(-1); }
  .corner.bl { bottom: 4px; left: 4px; transform: scaleY(-1); }
  .corner.br { bottom: 4px; right: 4px; transform: scale(-1, -1); }
  .tip {
    position: absolute; z-index: 5; pointer-events: none; min-width: 160px; max-width: 250px;
    background: var(--paper); color: var(--ink); border: 1.5px solid var(--olive-d); border-radius: 6px;
    padding: 10px 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 8px 22px var(--shadow);
  }
  .tip strong { display: block; font: 400 20px/1.1 var(--font-head); color: var(--head); margin-bottom: 6px; }
  .tip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
  .tip .row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 13px; }
  .legend .it { display: inline-flex; align-items: center; gap: 8px; }
  .legend .sw { font-size: 20px; line-height: 1; }
  .legend .sw.a { font-family: var(--font-head); color: var(--t1); }
  .legend .sw.b { font-family: var(--font-head); color: var(--t2); }
  .legend .sw.c { font-family: var(--font-body); font-weight: 600; font-size: 15px; color: var(--t3); }
  .legend .tail { color: var(--muted); }
  .tablewrap { overflow-x: auto; background: var(--paper); border: 2px solid var(--olive-d); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  caption { text-align: left; padding: 12px 14px 4px; font: 400 22px var(--font-head); color: var(--head); }
  th, td { text-align: right; padding: 8px 14px; border-bottom: 1px solid var(--olive); white-space: nowrap; }
  th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .rule { display: flex; align-items: center; gap: 12px; color: var(--olive-d); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1.5px; background: var(--olive-d); opacity: .55; }
  .rule svg { width: 54px; height: 24px; flex: none; }
  .note { font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 82ch; margin: 0; }
  .note b { color: var(--ink); font-weight: 600; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
</head>

      <path d="M2 12 C 14 4, 24 20, 36 12 S 48 10, 52 12" fill="none" style="stroke:var(--orn-stem)" stroke-width="2" stroke-linecap="round"/>

  </defs>
</svg>

<main class="wrap">
  <header>
    <svg class="vine-top" aria-hidden="true" focusable="false"><use href="#vine"/></svg>
    <h1>Palavras dos Artigos</h1>
    <p class="sub">As palavras que mais se repetem em quatro textos: dois artigos da revista Tempo Social (2026) e duas matérias da Folha de S.Paulo (novembro de 2026).</p>
  </header>

  <div class="controls">
    <label for="texto">Texto</label>
    <select id="texto"></select>
    <button id="btn-girar" type="button" aria-pressed="true">Pausar rotação</button>
    <button id="btn-tabela" type="button" aria-pressed="false">Ver como tabela</button>
  </div>

  <section class="stage" id="stage" aria-label="Esfera de palavras em 3D">
    <div id="cena" role="img" aria-label="Esfera giratória com as palavras mais frequentes; a lista completa está na tabela"></div>
    <p class="hint" id="dica">Arraste para girar · passe o mouse ou toque numa palavra</p>
    <svg class="corner tl" aria-hidden="true" focusable="false"><use href="#vine"/></svg>
    <svg class="corner tr" aria-hidden="true" focusable="false"><use href="#vine"/></svg>
    <svg class="corner bl" aria-hidden="true" focusable="false"><use href="#vine"/></svg>
    <svg class="corner br" aria-hidden="true" focusable="false"><use href="#vine"/></svg>
    <div class="tip" id="tip" hidden></div>
  </section>

  <ol class="sr-only" id="lista" aria-label="Palavras e ocorrências"></ol>

  <div class="tablewrap" id="tablewrap" hidden>
    <table id="tabela"></table>
  </div>

  <div class="legend" id="legenda" aria-label="Legenda: cor, fonte e tamanho indicam a frequência"></div>

  <div class="rule" aria-hidden="true"><svg focusable="false"><use href="#sprig"/></svg></div>

  <p class="note" id="nota"></p>
</main>

function note() {
  const tot = DATA.totais;
  $("nota").innerHTML = `<b>Como foi feito.</b> Contagem de palavras com ao menos 4 letras, depois de retirar palavras vazias (português e inglês), citações do tipo (Autor, ano), referências bibliográficas e palavras genéricas como "análise" e "autores". Palavras próximas ("negro", "negra") contam separadas. A posição na esfera não tem significado: as palavras são distribuídas por igual na superfície, e as que ficam atrás aparecem mais apagadas. <b>Fontes:</b> ${SRC.map((s, i) => `${s.longo} (${fmt(tot[i])} palavras contadas)`).join("; ")}. Os dois artigos científicos somam cerca de 91% do total, por isso a vista "Todos os textos" reflete sobretudo eles; use o filtro para ver cada texto. <b>Design:</b> baseado no modelo Art Nouveau Style Presentation, da SlidesCarnival, com as fontes Glass Antiqua e Open Sans; os ornamentos são desenhos próprios. Visualização 3D feita com Three.js.`;
}
function tipHTML(w) {
  const c = DATA.words[w], total = sum(c);
  return `<strong>${w}</strong>` + (view === "all"
    ? `<div class="row"><span>Total</span><b>${fmt(total)}</b></div>` + c.map((n, i) => n ? `<div class="row"><span>${SRC[i].curto}</span><b>${fmt(n)}</b></div>` : "").join("")
    : `<div class="row"><span>Neste texto</span><b>${fmt(c[view])}</b></div><div class="row"><span>Nos quatro textos</span><b>${fmt(total)}</b></div>`);
}
function placeTip(px, py) {
  const tip = $("tip"), sr = $("stage").getBoundingClientRect();
  let x = px - sr.left + 14, y = py - sr.top + 14;
  x = Math.min(x, sr.width - tip.offsetWidth - 8); y = Math.min(y, sr.height - tip.offsetHeight - 8);
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}

/* ---------- cena 3D ---------- */
function webglOK() {
  if (typeof THREE === "undefined" || !THREE.OrbitControls) return false;
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl") || c.getContext("experimental-webgl")); } catch (e) { return false; }
}
const GL = webglOK();
let renderer, scene, camera, controls, group, sprites = [], hovered = null;
const ray = GL ? new THREE.Raycaster() : null;
const mouse = GL ? new THREE.Vector2() : null;

function cssColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function wordTexture(word, isHead, color) {
  const px = 96, c = document.createElement("canvas"), x = c.getContext("2d");
  const font = (isHead ? F_G : F_O).replace("{s}", px);
  x.font = font;
  const w = Math.ceil(x.measureText(word).width) + 24, h = Math.ceil(px * 1.45);
  c.width = w; c.height = h;
  x.font = font; x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(word, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return { t, aspect: w / h };
}

function clearSprites() {
  for (const s of sprites) { group.remove(s); s.material.map.dispose(); s.material.dispose(); }
  sprites = []; hovered = null;
}

function buildSprites(list) {
  clearSprites();
  const n = list.length, max = list[0][1], min = list[n - 1][1];
  const cols = { 1: cssColor("--t1"), 2: cssColor("--t2"), 3: cssColor("--t3") };
  // pontos espalhados por igual na esfera (espiral de Fibonacci), embaralhados para não concentrar as maiores num polo
  const order = [...Array(n).keys()], rand = rng(7);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const golden = Math.PI * (3 - Math.sqrt(5));
  list.forEach(([w, cnt], i) => {
    const tr = tier(i), { t, aspect } = wordTexture(w, tr < 3, cols[tr]);
    const mat = new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false });
    const s = new THREE.Sprite(mat);
    const k = max === min ? 1 : Math.sqrt((cnt - min) / (max - min));
    const hgt = 0.75 + 2.7 * k;
    s.scale.set(hgt * aspect, hgt, 1);
    const p = order[i], y = 1 - 2 * (p + 0.5) / n, r = Math.sqrt(1 - y * y), phi = p * golden;
    const u = new THREE.Vector3(Math.cos(phi) * r, y, Math.sin(phi) * r);
    s.position.copy(u).multiplyScalar(RADIUS);
    s.userData = { w, u, sx: hgt * aspect, sy: hgt };
    group.add(s); sprites.push(s);
  });
}

function fit() {
  const host = $("cena"), W = Math.max(280, host.clientWidth);
  const H = Math.round(W * (W < 520 ? 1.05 : 0.6));
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const vf = camera.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  camera.position.setLength((RADIUS + 2.6) / Math.sin(Math.min(vf, hf) / 2));
}

function setHover(obj, ev) {
  if (obj === hovered) { if (obj && ev) placeTip(ev.clientX, ev.clientY); return; }
  if (hovered) hovered.scale.set(hovered.userData.sx, hovered.userData.sy, 1);
  hovered = obj;
  controls.autoRotate = spinning && !obj;
  const tip = $("tip");
  if (!obj) { tip.hidden = true; return; }
  obj.scale.set(obj.userData.sx * 1.15, obj.userData.sy * 1.15, 1);
  tip.innerHTML = tipHTML(obj.userData.w); tip.hidden = false;
  if (ev) placeTip(ev.clientX, ev.clientY);
}

function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(sprites).find(h => h.object.material.opacity > 0.55);
  setHover(hit ? hit.object : null, ev);
}

const camDir = GL ? new THREE.Vector3() : null;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  camDir.copy(camera.position).normalize();
  for (const s of sprites) {
    const f = (s.userData.u.dot(camDir) + 1) / 2;               // 0 = atrás, 1 = na frente
    const base = 0.05 + 0.95 * Math.pow(f, 2.4);
    s.material.opacity = hovered ? (s === hovered ? 1 : base * 0.3) : base;
  }
  renderer.render(scene, camera);
}

function initScene() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  $("cena").appendChild(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
  camera.position.set(0, 2, 30);
  group = new THREE.Group(); scene.add(group);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false; controls.enableZoom = false;
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.rotateSpeed = 0.6;
  controls.autoRotate = spinning; controls.autoRotateSpeed = 0.8;
  const el = renderer.domElement;
  el.addEventListener("pointermove", pick);
  el.addEventListener("click", pick);
  el.addEventListener("pointerleave", () => setHover(null));
  fit();
  let lastW = $("cena").clientWidth, raf;
  new ResizeObserver(() => {
    const w = $("cena").clientWidth;
    if (Math.abs(w - lastW) < 2) return;
    lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(fit);
  }).observe($("cena"));
  animate();
}

/* ---------- montagem ---------- */
function render() {
  const list = items(view);
  legend(list); renderTable(list);
  if (GL) buildSprites(list);
  $("tablewrap").hidden = !showTable;
}

$("texto").innerHTML = '<option value="all">Todos os textos</option>' + SRC.map((s, i) => `<option value="${i}">${s.longo}</option>`).join("");
$("texto").addEventListener("change", e => { view = e.target.value === "all" ? "all" : +e.target.value; if (GL) setHover(null); render(); });
$("btn-tabela").addEventListener("click", e => {
  showTable = !showTable;
  e.currentTarget.setAttribute("aria-pressed", showTable);
  e.currentTarget.textContent = showTable ? "Ocultar tabela" : "Ver como tabela";
  $("tablewrap").hidden = !showTable;
});
const btnGirar = $("btn-girar");
function syncSpinButton() {
  btnGirar.setAttribute("aria-pressed", spinning);
  btnGirar.textContent = spinning ? "Pausar rotação" : "Girar";
}
btnGirar.addEventListener("click", () => { spinning = !spinning; if (GL) controls.autoRotate = spinning && !hovered; syncSpinButton(); });
syncSpinButton();

note();
if (GL) {
  initScene();
  // recolore as palavras quando o tema muda (sistema ou escolha explícita)
  const recolor = () => buildSprites(items(view));
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", recolor);
  new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
} else {
  $("cena").innerHTML = '<p class="fallback">Seu navegador não exibiu a esfera 3D (WebGL indisponível). As palavras estão na tabela abaixo.</p>';
  $("dica").hidden = true; btnGirar.hidden = true;
  showTable = true; $("btn-tabela").setAttribute("aria-pressed", "true"); $("btn-tabela").textContent = "Ocultar tabela";
}
render();
// desenha de novo quando as fontes chegam, para as texturas usarem Glass Antiqua e Open Sans
if (GL && document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('400 20px "Glass Antiqua"'), document.fonts.load('600 20px "Open Sans"')])
    .then(() => buildSprites(items(view))).catch(() => {});
}
</script>
</body>
</html>
